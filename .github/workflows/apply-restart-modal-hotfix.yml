name: Apply restart modal hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-restart-modal-hotfix.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply restart modal lifecycle fix
        run: node .hotfix/apply-restart-modal-fix.mjs

      - name: Validate syntax and regression contracts
        run: |
          node --check app.js
          node tests.mjs

      - name: Commit verified hotfix
        run: |
          rm -rf .hotfix
          rm -f .github/workflows/apply-restart-modal-hotfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix restart modal lifecycle'
          git push origin HEAD:main
