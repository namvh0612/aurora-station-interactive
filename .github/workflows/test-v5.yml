name: Test Aurora scroll experience

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check v5-payload/loader.js
      - run: node --check ux-scroll-v6.js
      - run: node --check ux-scroll-v6-fix.js
      - run: node tests-v5-smoke.mjs
