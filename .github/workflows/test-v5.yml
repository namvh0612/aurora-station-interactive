name: Test Aurora cumulative story

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check core-v7.js
      - run: node --check app-v7.js
      - run: node tests-v7.mjs
