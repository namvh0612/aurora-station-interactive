name: Unify restart flow

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/unify-restart-flow.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply shared restart implementation
        run: node .hotfix/unify-restart-flow.mjs

      - name: Validate JavaScript and regressions
        run: |
          node --check app.js
          node --check core.js
          node --check tests.mjs
          node tests.mjs

      - name: Commit clean implementation
        run: |
          rm -rf .hotfix
          rm -f .github/workflows/unify-restart-flow.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Unify restart controls on proven reset flow'
          git push origin HEAD:main
