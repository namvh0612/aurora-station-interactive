name: Apply restart full-document reload hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-restart-reload-hotfix.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply restart reload hotfix
        run: node .hotfix/apply-restart-reload.mjs

      - name: Validate syntax and regression contracts
        run: |
          node --check app.js
          node tests.mjs
          grep -q 'window.location.replace' app.js
          grep -q 'app.js?v=4.1.1' index.html
          ! grep -q 'restartRequested' app.js

      - name: Commit verified hotfix and remove temporary files
        run: |
          rm -rf .hotfix
          rm -f .github/workflows/apply-restart-reload-hotfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reload cleanly after restart'
          git push origin HEAD:main
