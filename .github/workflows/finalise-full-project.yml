name: Apply story-first narrative rewrite

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-narrative:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore rewritten narrative and tests
        shell: bash
        run: |
          set -euo pipefail
          cat .narrative-deploy/chunk-* | base64 --decode | tar -xJf -

      - name: Validate syntax, scoring and narrative contract
        shell: bash
        run: |
          node --check app.js
          node --check audio.js
          node --check aurora.js
          node --check core.js
          node --check pdf-export.js
          node --check content/Aurora_Station_Content.js
          node tests.mjs

      - name: Remove temporary deployment files
        shell: bash
        run: |
          rm -rf .narrative-deploy .deploy
          rm -f .github/workflows/finalise-full-project.yml
          rm -f .story-first-trigger

      - name: Commit clean story-first project
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rewrite Aurora Station narrative for story-first delivery'
          git push origin main
