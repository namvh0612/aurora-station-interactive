name: Apply Option B Likert-balanced rewrite

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-option-b:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Option B branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply the statement-first rewrite
        shell: bash
        run: |
          set -euo pipefail
          node .option-b/apply-option-b.mjs
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('tests.mjs')
          s = p.read_text()
          s = s.replace('3.1.0-editorial-integrity', '4.0.0-option-b-likert-balanced')
          pattern = re.compile(
              r'assert\.match\(data\.narrativeDelivery\.revision,[\s\S]*?assert\.match\(editorialItems\.q56\.context, /All three must remain inside the heated refuge/i\);\n',
              re.M,
          )
          replacement = '''assert.match(data.assessment.methodNote, /requires empirical validation/i);\nconst optionBItems = Object.fromEntries(\n  data.story.acts.flatMap((act) => act.items).map((item) => [item.id, item]),\n);\nassert.match(optionBItems.q01.statement, /organised clearly/i);\nassert.match(optionBItems.q02.statement, /written boundary/i);\nassert.match(optionBItems.q03.statement, /invite him to speak/i);\nassert.match(optionBItems.q14.statement, /uncertainty/i);\nassert.match(optionBItems.q30.statement, /regain focus/i);\nassert.match(optionBItems.q36.statement, /recover an even tone/i);\nassert.match(optionBItems.q53.context, /consequences remain uncertain/i);\nassert.match(optionBItems.q56.statement, /shared refuge plan/i);\n'''
          s, count = pattern.subn(replacement, s)
          if count != 1:
              raise SystemExit(f'Expected one editorial assertion block, replaced {count}')
          p.write_text(s)
          PY

      - name: Validate syntax, scoring and Likert contract
        shell: bash
        run: |
          set -euo pipefail
          node --check content/Aurora_Station_Content.js
          node --check core.js
          node --check app.js
          node tests.mjs
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const sandbox = { window: {} };
          vm.runInNewContext(fs.readFileSync('content/Aurora_Station_Content.js', 'utf8'), sandbox);
          const data = sandbox.window.AURORA_STATION_DATA;
          const items = data.story.acts.flatMap(a => a.items);
          if (items.length !== 60) throw new Error('Expected 60 items');
          for (const item of items) {
            if (!item.statement.startsWith('I would')) throw new Error(`Q${item.number} is not a first-person behavioural statement`);
            if (!item.assessment.constructContract) throw new Error(`Q${item.number} missing construct contract`);
            const words = item.statement.trim().split(/\s+/).length;
            if (words > 18) throw new Error(`Q${item.number} statement exceeds 18 words`);
            const contextWords = item.context.trim().split(/\s+/).length;
            if (contextWords > 40) throw new Error(`Q${item.number} context exceeds 40 words`);
          }
          const signature = items.map(i => `${i.number}:${i.assessment.elementCode}:${i.assessment.facet}:${i.assessment.key}`).join('|');
          const expected = [
            '1:ME:Orderliness:+','2:FI:Assertiveness:R','3:EA:Empathy:+','4:WO:Ideas:+','5:WA:Calmness:+',
            '6:WO:Aesthetics:R','7:ME:Industriousness:+','8:EA:Cooperation:R','9:FI:Enthusiasm:+','10:WA:Resilience:+',
            '11:WO:Ideas:R','12:ME:Orderliness:R','13:FI:Assertiveness:+','14:EA:Empathy:+','15:WA:Calmness:+',
            '16:WA:Calmness:R','17:ME:Industriousness:+','18:EA:Cooperation:+','19:FI:Enthusiasm:R','20:WO:Aesthetics:+',
            '21:WO:Ideas:+','22:ME:Orderliness:R','23:FI:Assertiveness:+','24:EA:Empathy:R','25:WA:Resilience:+',
            '26:EA:Cooperation:+','27:ME:Industriousness:+','28:WO:Aesthetics:R','29:FI:Enthusiasm:R','30:WA:Resilience:+',
            '31:WO:Aesthetics:+','32:ME:Orderliness:+','33:EA:Empathy:+','34:FI:Assertiveness:+','35:WA:Calmness:R',
            '36:WA:Resilience:R','37:EA:Empathy:+','38:WO:Ideas:+','39:ME:Industriousness:R','40:FI:Enthusiasm:+',
            '41:WO:Aesthetics:+','42:ME:Orderliness:+','43:EA:Cooperation:R','44:FI:Enthusiasm:+','45:WA:Calmness:+',
            '46:ME:Industriousness:+','47:WO:Ideas:R','48:EA:Cooperation:+','49:FI:Assertiveness:+','50:WA:Resilience:R',
            '51:EA:Empathy:R','52:ME:Orderliness:+','53:WO:Ideas:+','54:WA:Calmness:+','55:FI:Assertiveness:R',
            '56:EA:Cooperation:+','57:ME:Industriousness:R','58:FI:Enthusiasm:+','59:WA:Resilience:+','60:WO:Aesthetics:+'
          ].join('|');
          if (signature !== expected) throw new Error('Assessment mapping changed');
          NODE

      - name: Commit verified Option B rewrite
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .option-b
          rm -f .github/workflows/apply-option-b-likert.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild narrative items with Likert-balanced Option B'
          git push origin HEAD:${{ github.head_ref }}
