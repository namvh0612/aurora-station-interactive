name: Test Aurora Station

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check the runtime modules
        run: |
          node --check content/Aurora_Station_Content.js
          node --check core.js
          node --check artwork.js
          node --check pdf-export.js
          node --check audio.js
          node --check app.js
          node --check results.js
      - name: Run the Aurora Station checks
        run: node tests.mjs
