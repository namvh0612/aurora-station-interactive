<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Aurora Station — a psychological hard-science-fiction night watch and behavioural self-reflection."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05080b" />
    <title>Aurora Station — The Final Watch</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./content/Aurora_Station_Content.js"></script>
    <script defer src="./core.js"></script>
    <script defer src="./artwork.js"></script>
    <script defer src="./pdf-export.js"></script>
    <script defer src="./audio.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="environment" aria-hidden="true">
      <div class="env-field"></div>
      <div class="env-drift"></div>
      <div class="env-aurora" id="env-aurora"></div>
    </div>

    <a class="skip-link" href="#watch">Skip to the watch</a>

    <header class="masthead">
      <div class="masthead-identity">
        <p class="mark" id="station-mark">AURORA STATION</p>
        <p class="mark" id="act-mark">FINAL WATCH</p>
      </div>
      <div class="masthead-controls">
        <div class="sequence" id="sequence" role="img" aria-label="Observation sequence not started">
          <span class="mark" id="sequence-label">OBS 00 / 60</span>
          <span class="sequence-ticks" id="sequence-ticks" aria-hidden="true"></span>
        </div>
        <button
          class="control control-menu"
          id="controls-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="controls-panel"
          aria-label="Station controls"
        >
          <span class="control-menu-text">Controls</span>
          <span class="control-menu-glyph" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
        </button>
        <div class="controls-panel" id="controls-panel">
          <button
            class="control"
            id="sound-toggle"
            type="button"
            aria-pressed="true"
            aria-label="Mute station sound"
          >
            <span class="sound-label">Sound</span>
          </button>
          <button
            class="control control-quiet"
            id="restart"
            type="button"
            aria-label="Start the watch again from the beginning"
          >
            Restart
          </button>
        </div>
      </div>
    </header>

    <main class="watch" id="watch" tabindex="-1">
      <p class="loading-note">Receiving the final watch…</p>
    </main>

    <div class="sr-only" id="announcer" role="status" aria-live="polite"></div>

    <noscript>
      <p class="loading-note">
        Aurora Station needs JavaScript enabled to record the watch and build the story.
      </p>
    </noscript>
  </body>
</html>
