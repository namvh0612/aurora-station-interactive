<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Aurora Station — an interactive story and Big Five reflection."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#06131d" />
    <title>Aurora Station — Your Journey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./aurora.js"></script>
    <script defer src="./content/Aurora_Station_Content.js"></script>
    <script defer src="./core.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.23/build/pdfmake.min.js"
    ></script>
    <script defer src="./pdf-export.js"></script>
    <script defer src="./visuals.js"></script>
    <script defer src="./image-export.js"></script>
    <script defer src="./audio.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="aurora-background" aria-hidden="true">
      <canvas id="aurora-canvas"></canvas>
      <div class="aurora-dimming-layer"></div>
      <div class="aurora-vignette"></div>
    </div>

    <header class="reader-bar" aria-label="Reading progress">
      <a class="reader-brand" href="#story-start">Aurora Station</a>
      <div
        class="reader-progress"
        role="progressbar"
        aria-label="Journey progress"
        aria-valuemin="0"
        aria-valuemax="60"
        aria-valuenow="0"
      >
        <span id="progress-fill"></span>
      </div>
      <span id="progress-label" class="progress-label">The final watch</span>
      <button
        id="sound-toggle"
        class="sound-toggle"
        type="button"
        aria-pressed="true"
        aria-label="Mute background soundtrack"
        title="The soundtrack begins after your first interaction."
      >
        <span class="sound-meter" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
        <span class="sound-label">Sound on</span>
      </button>
    </header>

    <main id="main-content" class="story-content">
      <article id="story" class="story" aria-live="polite">
        <p class="loading-copy">Receiving the final watch…</p>
      </article>
    </main>

    <div id="screen-reader-status" class="sr-only" aria-live="assertive"></div>

    <noscript>
      <p class="noscript-message">
        Aurora Station needs JavaScript enabled to remember choices and build
        the story.
      </p>
    </noscript>
  </body>
</html>
